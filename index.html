<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日待办</title>
<style>
:root{--ac:#5b6cff;--ink:#1d2340;--soft:#6b7290;--faint:#a7adc4;--line:rgba(29,35,64,.08);--ok:#18b47a;--sh:0 18px 45px -22px rgba(29,35,64,.35)}
*{box-sizing:border-box}
body{margin:0;padding:30px 18px 46px;font:15px/1.5 "PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;color:var(--ink);
background:radial-gradient(1100px 520px at 50% -14%,#e6e9ff,rgba(230,233,255,0) 62%),linear-gradient(180deg,#f4f5fc,#f8f9fd 46%,#f6f7fc);background-attachment:fixed}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
/* ===== 上方居中：日历 ===== */
.cal{max-width:520px;margin:0 auto;padding:18px 22px 20px;border-radius:26px}
.head{display:flex;align-items:center;justify-content:space-between}
.title{text-align:center;line-height:1.25}
.title b{font-size:1.22rem}
.title span{display:block;font-size:.75rem;color:var(--faint);letter-spacing:.16em}
.nav{width:38px;height:38px;border:1px solid var(--line);background:#fbfbfe;color:var(--soft);border-radius:12px;font-size:1.15rem;cursor:pointer;transition:.16s}
.nav:hover{background:rgba(91,108,255,.1);color:var(--ac);border-color:rgba(91,108,255,.28)}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk{margin:10px 0 4px}
.wk span{text-align:center;font-size:.74rem;letter-spacing:.12em;color:var(--faint)}
.day{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:14px;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer;transition:.16s}
.day:hover{background:rgba(29,35,64,.05)}
.day.out{color:var(--faint)}
.day.sel{background:rgba(91,108,255,.1);color:#4152e0;font-weight:700}
/* 今日日期：放大 + 高亮 */
.day.today{background:linear-gradient(160deg,var(--ac),#7a86ff);color:#fff;font-size:1.6rem;font-weight:800;transform:scale(1.1);z-index:2;box-shadow:0 10px 22px -8px rgba(91,108,255,.85)}
.day.today.sel{box-shadow:0 0 0 3px rgba(91,108,255,.25),0 10px 22px -8px rgba(91,108,255,.85)}
.day i{position:absolute;bottom:12%;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.day.today i{background:#fff;bottom:14%}
.foot{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;font-size:.82rem;color:var(--soft)}
.link{border:0;background:none;color:var(--ac);font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:9px;transition:.16s}
.link:hover{background:rgba(91,108,255,.1)}
/* ===== 下方：左待办 / 右已完成 ===== */
.panels{max-width:1040px;margin:24px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.panel{padding:18px 18px 14px;display:flex;flex-direction:column;min-height:340px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pt{display:flex;align-items:center;gap:9px;font-size:1.03rem;font-weight:700}
.pt u{width:4px;height:16px;border-radius:3px;background:var(--ac)}
.done .pt u{background:var(--ok)}
.cnt{font-size:.75rem;font-weight:600;color:var(--soft);background:#f2f3fa;border-radius:99px;padding:3px 10px}
.sub{margin:0 0 14px;font-size:.78rem;color:var(--faint)}
.add{display:flex;gap:9px;margin-bottom:14px}
.add input{flex:1;min-width:0;font:inherit;font-size:.92rem;padding:11px 15px;border:1px solid var(--line);background:#fafbff;border-radius:13px;outline:0;transition:.16s}
.add input:focus{border-color:rgba(91,108,255,.45);background:#fff;box-shadow:0 0 0 4px rgba(91,108,255,.12)}
.add button{font:inherit;font-size:.88rem;font-weight:600;color:#fff;background:linear-gradient(160deg,var(--ac),#7a86ff);border:0;border-radius:13px;padding:0 17px;cursor:pointer;box-shadow:0 10px 20px -12px rgba(91,108,255,.95)}
.add button:hover{filter:brightness(1.05)}
ul{list-style:none;margin:0;padding:0 4px 0 0;display:flex;flex-direction:column;gap:7px;max-height:360px;overflow-y:auto;flex:1}
li.item{display:flex;align-items:flex-start;gap:11px;padding:11px 11px 11px 12px;border:1px solid transparent;border-radius:14px;background:#fafbff;cursor:pointer;user-select:none;transition:.16s;animation:pop .25s ease both}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
li.item:hover{background:#f4f6ff;border-color:rgba(91,108,255,.16)}
.box{flex:none;width:21px;height:21px;margin-top:1px;border:1.6px solid #ccd1e6;border-radius:7px;background:#fff;color:transparent;font-size:.78rem;line-height:19px;text-align:center;transition:.16s}
li.item:hover .box{border-color:var(--ac);color:rgba(91,108,255,.35)}
.tx{flex:1;min-width:0;font-size:.93rem;word-break:break-word;white-space:pre-wrap}
.tm{flex:none;align-self:center;font-size:.72rem;color:var(--faint)}
.del{flex:none;border:0;background:none;color:var(--faint);font-size:1rem;line-height:1;padding:4px 5px;border-radius:8px;cursor:pointer;opacity:0;transition:.16s}
li.item:hover .del{opacity:1}
.del:hover{background:#ffe9ec;color:#e5486a}
/* 已完成样式 */
.done li.item{background:#f7fbf9}
.done li.item:hover{background:#f0f9f4;border-color:rgba(24,180,122,.22)}
.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.done .tx{color:var(--soft);text-decoration:line-through}
.empty{margin:auto;padding:34px 14px;text-align:center;font-size:.85rem;line-height:1.9;color:var(--faint)}
.empty b{display:block;font-size:1.6rem;font-weight:400;opacity:.5}
.pf{display:flex;justify-content:flex-end;padding-top:10px;margin-top:8px;border-top:1px dashed var(--line)}
@media(max-width:840px){body{padding:18px 12px 36px}.panels{grid-template-columns:1fr}.panel{min-height:auto}ul{max-height:300px}.day.today{font-size:1.3rem}}
</style>
</head>
<body>

<!-- 上方居中：日历 -->
<section class="card cal">
  <div class="head">
    <button class="nav" id="prev" aria-label="上个月">‹</button>
    <div class="title"><b id="ml">—</b><span id="yl">—</span></div>
    <button class="nav" id="next" aria-label="下个月">›</button>
  </div>
  <div class="wk"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
  <div class="days" id="days"></div>
  <div class="foot"><span id="todayLine">—</span><button class="link" id="todayBtn">回到今天</button></div>
</section>

<!-- 左下待办 / 右下已完成 -->
<main class="panels">
  <section class="card panel">
    <div class="ph"><div class="pt"><u></u>待办事项</div><span class="cnt" id="todoCount">0</span></div>
    <p class="sub" id="todoSub">—</p>
    <form class="add" id="addForm" autocomplete="off">
      <input id="addInput" maxlength="200" placeholder="添加今天要做的事，回车即可…" aria-label="新增待办">
      <button type="submit">+ 添加</button>
    </form>
    <ul id="todoList"></ul>
  </section>

  <section class="card panel done">
    <div class="ph"><div class="pt"><u></u>已完成</div><span class="cnt" id="doneCount">0</span></div>
    <p class="sub" id="doneSub">—</p>
    <ul id="doneList"></ul>
    <div class="pf"><button class="link" id="clearDone">清空已完成</button></div>
  </section>
</main>

<script>
(function(){
  "use strict";
  var KEY="daily-todo-board-v1", WD=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  var $=function(s){return document.querySelector(s)};
  var store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){store={}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
  function k(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function parse(key){var p=key.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
  function label(key){var d=parse(key);return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 · "+WD[d.getDay()]}
  function list(key){if(!Array.isArray(store[key]))store[key]=[];return store[key]}

  var today=new Date(), todayKey=k(today);
  var sel=todayKey, view={y:today.getFullYear(),m:today.getMonth()};

  function renderCal(){
    $("#ml").textContent=(view.m+1)+" 月";
    $("#yl").textContent=view.y+" 年";
    var lead=(new Date(view.y,view.m,1).getDay()+6)%7;   /* 周一为一周第一天 */
    var frag=document.createDocumentFragment();
    for(var i=0;i<42;i++){
      var d=new Date(view.y,view.m,1-lead+i), key=k(d), b=document.createElement("button");
      b.type="button"; b.className="day"; b.dataset.key=key; b.textContent=d.getDate();
      b.setAttribute("aria-label",d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日");
      if(d.getMonth()!==view.m) b.classList.add("out");
      if(key===sel) b.classList.add("sel");
      if(key===todayKey){b.classList.add("today");b.setAttribute("aria-current","date")}
      if((store[key]||[]).some(function(x){return !x.done})){
        var dot=document.createElement("i"); b.appendChild(dot);
      }
      b.onclick=(function(dd,kk){return function(){
        sel=kk;
        if(dd.getMonth()!==view.m||dd.getFullYear()!==view.y) view={y:dd.getFullYear(),m:dd.getMonth()};
        render();
      }})(d,key);
      frag.appendChild(b);
    }
    var days=$("#days"); days.innerHTML=""; days.appendChild(frag);
    $("#todayLine").textContent="今天 "+label(todayKey);
  }

  function row(it){
    var li=document.createElement("li"); li.className="item"; li.dataset.id=it.id;
    var box=document.createElement("span"); box.className="box"; box.textContent="✓";
    var tx=document.createElement("span"); tx.className="tx"; tx.textContent=it.text;
    li.appendChild(box); li.appendChild(tx);
    if(it.done&&it.doneAt){var tm=document.createElement("span");tm.className="tm";tm.textContent=it.doneAt;li.appendChild(tm)}
    var del=document.createElement("button"); del.type="button"; del.className="del"; del.textContent="✕"; del.title="删除";
    li.appendChild(del);
    li.onclick=function(e){ if(e.target===del){ removeItem(it.id); } else { toggleItem(it.id); } };
    return li;
  }

  function renderLists(){
    var arr=list(sel), todo=arr.filter(function(x){return !x.done}), done=arr.filter(function(x){return x.done});
    var tl=$("#todoList"), dl=$("#doneList");
    tl.innerHTML=""; dl.innerHTML="";
    if(todo.length){ todo.forEach(function(x){tl.appendChild(row(x))}) }
    else { tl.innerHTML='<li class="empty"><b>✦</b>还没有待办，在上面输入框添加一条吧</li>' }
    if(done.length){ done.forEach(function(x){dl.appendChild(row(x))}) }
    else { dl.innerHTML='<li class="empty"><b>☑</b>完成的事情会出现在这里<br>点一下勾选框就能移过来</li>' }
    $("#todoCount").textContent=todo.length;
    $("#doneCount").textContent=done.length;
    var none=done.length===0;
    $("#clearDone").disabled=none;
    $("#clearDone").style.opacity=none?".4":"1";
    $("#clearDone").style.pointerEvents=none?"none":"auto";
    var p=(sel===todayKey?"今天 · ":"")+label(sel);
    $("#todoSub").textContent=p+" · 还有 "+todo.length+" 件待完成";
    $("#doneSub").textContent=p+" · 已完成 "+done.length+" 件";
  }

  function render(){ renderCal(); renderLists(); }

  function toggleItem(id){
    var it=list(sel).filter(function(x){return x.id===id})[0]; if(!it) return;
    it.done=!it.done;
    if(it.done){var d=new Date();it.doneAt=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
    else it.doneAt="";
    save(); render();
  }
  function removeItem(id){ store[sel]=list(sel).filter(function(x){return x.id!==id}); save(); render(); }

  $("#addForm").onsubmit=function(e){
    e.preventDefault();
    var v=$("#addInput").value.trim(); if(!v) return;
    list(sel).push({id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),text:v,done:false,doneAt:""});
    $("#addInput").value=""; save(); render(); $("#addInput").focus();
  };
  $("#clearDone").onclick=function(){ store[sel]=list(sel).filter(function(x){return !x.done}); save(); render(); };
  $("#prev").onclick=function(){ view.m--; if(view.m<0){view.m=11;view.y--} renderCal(); };
  $("#next").onclick=function(){ view.m++; if(view.m>11){view.m=0;view.y++} renderCal(); };
  $("#todayBtn").onclick=function(){
    today=new Date(); todayKey=k(today); sel=todayKey;
    view={y:today.getFullYear(),m:today.getMonth()}; render();
  };

  render();
})();
</script>
</body>
</html>
